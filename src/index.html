<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      width: 100px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    #range {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1;
    }
    .char {
      flex-shrink: 0;
      width: 1em;
      height: 1em
    }
    .line {
      display: flex;
    }
    #ascii {
      display: flex;
      line-height: 1;
      flex-direction: column;
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <input type="range" min="2" max="16" id="range" value="16">
  <video autoplay id="video" style="display: none;"></video>
  <div id="ascii"></div>
</body>

<script src="./index.js"></script>
<script src="./charlist/braille.js"></script>
<script src="./Char.js"></script>
<script src="./Ascii.js"></script>
<script>
  const video = document.getElementById('video')
  const range = document.getElementById('range')
  const asciiDiv = document.getElementById('ascii')

  // Taille d'un caractère en px selon le curseur, et grille qui couvre tout le viewport
  function gridSize() {
    const size = Number(range.value)
    return {
      size,
      cols: Math.ceil(window.innerWidth / size),
      rows: Math.ceil(window.innerHeight / size),
    }
  }

  ;(async _ => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      video.srcObject = await getCamera()
      let { size, cols, rows } = gridSize()
      asciiDiv.style.fontSize = size + 'px'
      const ascii = new Ascii(cols, rows)

      function resize() {
        ;({ size, cols, rows } = gridSize())
        asciiDiv.style.fontSize = size + 'px'
        if (cols !== ascii.width || rows !== ascii.height) ascii.changeSize(cols, rows)
      }
      range.oninput = resize
      window.addEventListener('resize', resize)
      launch(ascii)
    } else {
      return console.log('not supported')
    }
  })().catch(console.error)
</script>

</html>
