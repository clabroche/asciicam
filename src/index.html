<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      width: 100px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    #range {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1;
    }
    #ascii {
      display: flex;
      line-height: 1;
      font-family: monospace;
      white-space: pre;
      flex-direction: column;
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <input type="range" min="2" max="16" id="range" value="16">
  <video autoplay id="video" style="display: none;"></video>
  <div id="ascii"></div>
</body>

<script src="./index.js"></script>
<script src="./charlist/braille.js"></script>
<script src="./Ascii.js"></script>
<script>
  const video = document.getElementById('video')
  const range = document.getElementById('range')
  const asciiDiv = document.getElementById('ascii')

  // Mesure la taille réelle d'un glyphe braille pour une taille de police donnée
  function measureCell(size) {
    const probe = document.createElement('span')
    probe.style.cssText = `position:absolute;display:inline-block;visibility:hidden;font-family:monospace;line-height:1;white-space:pre;font-size:${size}px`
    probe.textContent = '\u28ff'.repeat(100)
    document.body.appendChild(probe)
    const { width, height } = probe.getBoundingClientRect()
    probe.remove()
    return { cw: width / 100, ch: height }
  }

  // Grille qui couvre tout le viewport, selon la taille de caractère choisie au curseur
  function gridSize() {
    const size = Number(range.value)
    const { cw, ch } = measureCell(size)
    const cols = Math.ceil(window.innerWidth / cw)
    const rows = Math.ceil(window.innerHeight / ch)
    return { size, cols, rows, aspect: (cols * cw) / (rows * ch) }
  }

  ;(async _ => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      video.srcObject = await getCamera()
      let grid = gridSize()
      asciiDiv.style.fontSize = grid.size + 'px'
      const ascii = new Ascii(grid.cols, grid.rows)

      function resize() {
        grid = gridSize()
        asciiDiv.style.fontSize = grid.size + 'px'
        if (grid.cols !== ascii.width || grid.rows !== ascii.height) ascii.changeSize(grid.cols, grid.rows)
      }
      range.oninput = resize
      window.addEventListener('resize', resize)
      launch(ascii, () => grid.aspect)
    } else {
      return console.log('not supported')
    }
  })().catch(console.error)
</script>

</html>
