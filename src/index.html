<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      width: 100px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    #range {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1;
    }
    #ascii {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <input type="range" min="2" max="16" id="range" value="16">
  <video autoplay id="video" style="display: none;"></video>
  <canvas id="ascii"></canvas>
</body>

<script src="./index.js"></script>
<script src="./charlist/braille.js"></script>
<script src="./Ascii.js"></script>
<script>
  const video = document.getElementById('video')
  const range = document.getElementById('range')
  const asciiCanvas = document.getElementById('ascii')

  // Mesure la taille réelle d'un glyphe braille pour une taille de police donnée
  function measureCell(size) {
    const probe = document.createElement('span')
    probe.style.cssText = `position:absolute;display:inline-block;visibility:hidden;font-family:monospace;line-height:1;white-space:pre;font-size:${size}px`
    probe.textContent = '\u28ff'.repeat(100)
    document.body.appendChild(probe)
    const { width, height } = probe.getBoundingClientRect()
    probe.remove()
    return { cw: width / 100, ch: height }
  }

  ;(async _ => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      video.srcObject = await getCamera()
      const ascii = new Ascii(asciiCanvas, video)

      // Recalcule la grille selon la taille de caractère choisie au curseur
      function resize() {
        const size = Number(range.value)
        const { cw, ch } = measureCell(size)
        ascii.resize(size, cw, ch)
      }
      resize()
      range.oninput = resize
      window.addEventListener('resize', resize)
      launch(ascii)
    } else {
      return console.log('not supported')
    }
  })().catch(console.error)
</script>

</html>
